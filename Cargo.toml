[package]
name = "MiurBot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-sqlite","runtime-tokio-native-tls"] }
axum = { version = "0.8" }
serde = { version = "1" }
serde_json = { version = "1" }
reqwest = { version = "0.12", features = ["json","stream"] }
jsonwebtoken = { version = "9" }
dotenvy = { version = "0.15" }
config = { version = "0.15" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
chrono = "0.4.45"
futures-util = "0.3.33"
